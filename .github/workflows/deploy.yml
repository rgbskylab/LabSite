# main 브랜치에 push(머지)되면 사이트를 정적 파일로 빌드해서 GitHub Pages에 배포합니다.
# 처음 한 번은 리포 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동으로 실행할 때

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 마치고, 대기 중인 것만 최신 것으로 교체
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # next.config.ts 의 output: "export" 로 out/ 폴더가 생성됨
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
