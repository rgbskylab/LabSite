# PR이 열리면 Claude가 diff를 리뷰하고 PR에 댓글을 남김 (이후 커밋에는 리뷰하지 않음)
# 초안 PR은 열릴 때 건너뛰고, 리뷰 준비 완료로 바뀔 때 리뷰함
# Claude Code(claude-code-action) 대신 Claude API(Messages API)를 직접 호출하므로
# 사용량이 API 크레딧으로 청구됨
# 인증: Anthropic Workload Identity Federation (API 키 없음)
name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # Anthropic WIF 토큰 교환에 필요

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 포크에서 온 PR(OIDC 토큰이 발급되지 않음)과 초안 PR은 건너뜀
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01YTutQs9yWUGNvyoK8865q3
      ANTHROPIC_ORGANIZATION_ID: 1c15fde5-7231-42c8-a825-3fa57f640a3a
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01XvYrifmyC2AyYXPtik7pwT
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Ak5VYEdAaBCbNsFy9n2xii
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-oidc/jwt
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install Anthropic SDK
        run: |
          node --version
          mkdir -p "$RUNNER_TEMP/claude-review"
          cp .github/scripts/claude-pr-review.mjs "$RUNNER_TEMP/claude-review/"
          cd "$RUNNER_TEMP/claude-review"
          echo '{"private": true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts @anthropic-ai/sdk@1.4.0

      # GitHub OIDC 토큰은 5분 정도 유효하므로 리뷰 직전에 받음
      - name: Fetch GitHub OIDC token
        run: |
          set -o pipefail
          umask 077
          mkdir -p "$(dirname "$ANTHROPIC_IDENTITY_TOKEN_FILE")"
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      - name: Review with Claude
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/claude-review/claude-pr-review.mjs"
