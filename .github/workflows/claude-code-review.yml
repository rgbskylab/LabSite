# PR이 열리거나 새 커밋이 올라오면 Claude가 리뷰하고 PR에 댓글을 남김
# 인증: Anthropic Workload identity federation (API 키 없음)
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # Anthropic WIF 토큰 교환에 필요

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01YTutQs9yWUGNvyoK8865q3
          anthropic_organization_id: 1c15fde5-7231-42c8-a825-3fa57f640a3a
          anthropic_service_account_id: svac_01XvYrifmyC2AyYXPtik7pwT
          anthropic_workspace_id: wrkspc_01FcqNfvU6v5H9tCSxSeQLeX
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
