# ─────────────────────────────────────────────────────────────
#  졸업생(Alumni) — members.yml 에서 옮겨온 항목에
#  아래 두 필드만 추가하면 됩니다:
#     graduated: 졸업연도 (숫자)
#     now:       현재 소속/직함 (ko/en)
#
#  degree 값: phd | ms | postdoc | undergrad  (받은 학위)
#  사이트에서 졸업연도 내림차순으로 자동 정렬됩니다.
#
#  ⚠️ graduated(졸업연도)는 실제 값을 몰라 임시로 2025 로 넣었습니다.
#     각자 실제 졸업연도로 꼭 수정하세요! (연도별로 자동 그룹핑됩니다)
#     now(현직)는 사이트에 있던 소속을 반영했고, 한글 표기는 확인이 필요할 수 있습니다.
# ─────────────────────────────────────────────────────────────

